[project]
name = "runpod-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.3.4",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "comfy-cli>=1.5.4",
]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = true
exclude = [".venv", "__pycache__", "build", "dist", "ComfyUI"]
# The previous ignore rule for 'modal.*' was removed after renaming modal.py to avoid name conflict with the modal package.

[tool.ruff]
line-length = 120
exclude = [".venv", "__pycache__", "build", "dist", "ComfyUI"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
exclude = [".venv", "__pycache__", "build", "dist", "ComfyUI"]
